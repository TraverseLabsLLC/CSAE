[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "csae"
version = "0.1.0"
description = "Verifiable context transfer between AI agents: signed, hash-chained attestations with provenance tracking"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
authors = [
    {name = "Traverse Labs LLC", email = "brett@traverselabs.ai"}
]
keywords = ["ai", "agents", "provenance", "attestation", "integrity", "mcp", "a2a"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "cryptography>=41.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/traverselabs/csae"
Documentation = "https://github.com/traverselabs/csae#readme"
Issues = "https://github.com/traverselabs/csae/issues"
Commercial = "https://traverselabs.ai"

[tool.setuptools.packages.find]
include = ["csae*"]
